<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMOWorld Admin</title><style>body{margin:0;background:#f3f6fc;color:#18233a;font:15px system-ui,Arial}.wrap{max-width:850px;margin:35px auto;padding:18px}section{background:white;border:1px solid #e1e7f0;border-radius:16px;padding:22px;margin:15px 0}h1{margin-top:0}.field{display:grid;gap:5px;margin:12px 0}.field label{font-weight:700;font-size:13px}.field input,.field textarea,.field select{padding:11px;border:1px solid #dce3ee;border-radius:9px;font:inherit}textarea{min-height:75px}button{padding:10px 14px;border:0;border-radius:9px;font-weight:800;cursor:pointer}.primary{background:#2457c5;color:white}.light{background:#edf1f8}.danger{background:#ffe8e8;color:#9d2020}.row{display:flex;gap:8px;flex-wrap:wrap}.game{border-top:1px solid #e5eaf2;padding:13px 0;display:flex;justify-content:space-between;gap:12px}.muted{color:#66738a;font-size:13px}#panel{display:none}.msg{padding:10px;background:#fff4d6;border-radius:8px;margin:10px 0}</style></head><body><main class="wrap"><a href="/">← Public website</a><h1>MMOWorld Admin</h1><section id="login"><h2>Admin access</h2><p class="muted">Enter your private access code to manage game listings.</p><div class="field"><label>Secret access code</label><input id="password" type="password" autocomplete="current-password"></div><button class="primary" id="loginBtn">Sign in</button><div id="loginMsg" class="msg" hidden></div></section><div id="panel"><section><div class="row" style="justify-content:space-between;align-items:center"><h2>Publish a game</h2><button class="light" id="logout">Sign out</button></div><form id="gameForm"><input id="editId" type="hidden"><div class="field"><label>Game name *</label><input id="name" required maxlength="100"></div><div class="field"><label>Category</label><select id="cat"><option>Pokémon Fan Game</option><option>Pokémon MMO</option><option>Other MMO</option><option>Beta / Early Access</option><option>Browser RPG</option><option>Other</option></select></div><div class="field"><label>Description</label><textarea id="desc" maxlength="1000"></textarea></div><div class="field"><label>Game link *</label><input id="link" type="url" placeholder="https://..." required></div><div class="field"><label>Image URL (optional)</label><input id="photo" type="url" placeholder="https://..."></div><div class="field"><label>Referral disclosure (optional)</label><input id="disclosure" maxlength="300"></div><div class="row"><button class="primary" type="submit" id="saveBtn">Publish game</button><button class="light" type="button" id="cancelEdit" hidden>Cancel edit</button></div></form><div id="formMsg" class="msg" hidden></div></section><section><h2>Published games</h2><div id="games">Loading…</div></section></div></main><script>const $=id=>document.getElementById(id);async function api(path,opts={}){const r=await fetch('/api/'+path,{...opts,headers:{'content-type':'application/json',...(opts.headers||{})},credentials:'same-origin'});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'Request failed');return data}function msg(id,text){$(id).hidden=false;$(id).textContent=text}function showPanel(){ $('login').style.display='none';$('panel').style.display='block';loadGames()}async function check(){try{const s=await api('admin/session');if(s.authenticated)showPanel()}catch{}}$('loginBtn').onclick=async()=>{try{await api('admin/login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('password').value='';showPanel()}catch(e){msg('loginMsg',e.message)}};$('password').onkeydown=e=>{if(e.key==='Enter')$('loginBtn').click()};$('logout').onclick=async()=>{await api('admin/logout',{method:'POST'});location.reload()};function reset(){ $('gameForm').reset();$('editId').value='';$('saveBtn').textContent='Publish game';$('cancelEdit').hidden=true}$('cancelEdit').onclick=reset;$('gameForm').onsubmit=async e=>{e.preventDefault();const body={name:$('name').value,cat:$('cat').value,desc:$('desc').value,link:$('link').value,photo:$('photo').value,disclosure:$('disclosure').value};try{if($('editId').value){await api('games/'+$('editId').value,{method:'PUT',body:JSON.stringify(body)});msg('formMsg','Game updated.')}else{await api('games',{method:'POST',body:JSON.stringify(body)});msg('formMsg','Game published.')}reset();loadGames()}catch(err){msg('formMsg',err.message)}};async function loadGames(){try{const a=await api('games');$('games').innerHTML=a.length?a.map(g=>`<div class="game"><div><b>${safe(g.name)}</b><div class="muted">${safe(g.cat||'Other')}</div></div><div class="row"><button class="light" onclick="editGame('${g.id}')">Edit</button><button class="danger" onclick="deleteGame('${g.id}')">Delete</button></div></div>`).join(''):'No games published yet.';window.gameData=a}catch(e){$('games').textContent=e.message}}function safe(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}window.editGame=id=>{const g=window.gameData.find(x=>x.id===id);if(!g)return;$('editId').value=g.id;$('name').value=g.name;$('cat').value=g.cat;$('desc').value=g.desc;$('link').value=g.link;$('photo').value=g.photo;$('disclosure').value=g.disclosure;$('saveBtn').textContent='Save changes';$('cancelEdit').hidden=false;window.scrollTo({top:0,behavior:'smooth'})};window.deleteGame=async id=>{if(!confirm('Delete this game listing?'))return;try{await api('games/'+id,{method:'DELETE'});loadGames()}catch(e){alert(e.message)}};check();</script></body></html>
